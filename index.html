<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mental Health Check‑In</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
<h1>🌱 Mental Health Check‑In</h1>
<p class="subtitle">How are you feeling today?</p>


<div class="moods">
<button>😊</button>
<button>😐</button>
<button>😔</button>
<button>😡</button>
<button>😴</button>
</div>


<textarea placeholder="Optional: Write a few thoughts..."></textarea>


<div class="tip" id="tip"></div>


<div class="emergency">
<strong>Need urgent help?</strong><br />
Call <b>10111</b> or visit your nearest health facility.
</div>
</div>


<script src="script.js"></script>
</body>
</html>
